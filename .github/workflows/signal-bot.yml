name: PentaSignal

on:
  schedule:
    # هر ۳۰ دقیقه یکبار، فقط از ساعت ۶ صبح تا ۱۲ شب به وقت تهران (UTC 2:00–20:30)
    - cron: "0,30 2-20 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # لازم برای push کردن CSV توسط github-actions[bot]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: Upload log file
        uses: actions/upload-artifact@v4
        with:
          name: bot-log
          path: bot_log.txt
          if-no-files-found: ignore

      - name: Commit daily CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daytime: append new signals"
          file_pattern: signals/*.csv
