# PentaSignal v3 — سیگنال + تعیین تکلیف، هر ۳۰ دقیقه در پنجره 07:00–20:00 تهران
name: "PentaSignal Bot · 30m Signal Window"

on:
  schedule:
    # 07:00..19:30 تهران = 03:30..16:00 UTC
    - cron: "0,30 3-16 * * *"
  workflow_dispatch: {}

concurrency:
  group: pentasignal-live
  cancel-in-progress: false

jobs:
  tick:
    name: "تیک 30m — سیگنال + تعیین تکلیف + آرشیو 1m"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run signal tick
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: "0"
        run: python run_bot.py --once --signal
      - name: Upload bot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-log-${{ github.run_id }}
          path: data/bot_log.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Persist signals, state and 90d OHLCV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: 30m signal tick + 1m market data [skip ci]"
          file_pattern: "data/"
          