# PentaSignal v3 — گزارش شبانه دقیقاً ساعت 02:00 تهران
name: "PentaSignal Nightly · 02:00 Report"

on:
  schedule:
    # 02:00 تهران = 22:30 UTC روز قبل
    - cron: "30 22 * * *"
  workflow_dispatch: {}

concurrency:
  group: pentasignal-live
  cancel-in-progress: false

jobs:
  nightly:
    name: "گزارش شبانه 02:00 + نگهداری 90 روزه"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run nightly report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: "0"
        run: python run_bot.py --once --nightly
      - name: Upload nightly log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-log-${{ github.run_id }}
          path: data/bot_log.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Persist nightly report and data rotation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "nightly: 02:00 report + 90d data rotation [skip ci]"
          file_pattern: "data/"