# PentaSignal v3 — 20:00 تا 01:00 تهران فقط تعیین تکلیف
name: "PentaSignal Bot · Night Settlement"

on:
  schedule:
    # 20:00..01:00 تهران = 16:30..21:30 UTC
    - cron: "0,30 16-21 * * *"
  workflow_dispatch: {}

concurrency:
  group: pentasignal-live
  cancel-in-progress: false

jobs:
  settle:
    name: "تسویه 1m — بدون سیگنال جدید"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run settlement tick
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: "0"
        run: python run_bot.py --once --settle
      - name: Upload bot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settle-log-${{ github.run_id }}
          path: data/bot_log.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Persist settlement and 90d OHLCV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: settlement tick + 1m market data [skip ci]"
          file_pattern: "data/signals.csv data/events.csv data/state.json data/reports data/archive data/ohlcv"
