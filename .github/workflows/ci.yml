# تست‌های PentaSignal — روی هر push (با API عمومی KuCoin؛ بدون سکرت)

name: "PentaSignal CI · Test Suite"

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "data/**"      # کامیت‌های دیتای ربات نیاز به تست ندارند
      - "**.md"
  pull_request:
    paths-ignore:
      - "data/**"
      - "**.md"
  workflow_dispatch: {}

jobs:
  test:
    name: "سری تست ۶ پاسه"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run deterministic PentaSignal v3 tests
        env:
          DRY_RUN: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/last_run_ci.json
          if-no-files-found: ignore
